<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * { box-sizing: border-box; }
    html, body {
  height: 100%;
}
    
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      overflow: hidden;
       overflow-y: auto;     /* permite vertical */
    }

    /* HEADER */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .brand img { height: 48px; }

    .menu {
      display: flex;
      gap: 1.5rem;
    }

    .menu a {
      font-size: 0.9rem;
      text-decoration: none;
      color: #111;
      opacity: 0.8;
    }

    .menu a:hover { opacity: 1; }

    @media (max-width: 768px) {
  body {
    overflow-y: visible; /* 👈 clave para móvil */
  }
}


    /* PAGE */
.page {
  padding-top: 90px;     /* header (70px) + aire visual */
  padding-left: 6vw;
  padding-right: 6vw;
  padding-bottom: 40px;

  max-width: 900px;
  margin: 0 auto;
}
    /* ARTWORK */
   .artwork {
  width: 100%;
  max-height: 60vh;
  aspect-ratio: 3 / 4;
 
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  margin-bottom: 1rem;
}


    h1 {
      font-size: 1.6rem;
      font-weight: 400;
      margin-bottom: 0.2rem;
    }

    .price {
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

.artwork-info{

    margin-top:30px;

    margin-bottom:35px;

}

.artwork-meta{

    color:#666;

    font-size:.95rem;

    line-height:1.8;

    margin-bottom:25px;

}

#artwork-description{

    font-size:1rem;

    line-height:1.7;

    color:#222;

}

.conditions{

    margin-top:35px;

    font-size:.85rem;

    color:#666;

    line-height:1.8;

}

    /* PAYPAL */
    .paypal-wrapper {
      margin: 1.2rem 0;
    }

    /* CONDITIONS */

<div class="price" id="artwork-price"></div>
