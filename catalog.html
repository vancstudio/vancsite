  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      user-select: none; /* bloquea selección */                                  
    }

    /* HEADER */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .brand img { height: 48px; }

    .menu {
      display: flex;
      gap: 1.5rem;
    }

    .menu a {
      font-size: 0.9rem;
      text-decoration: none;
      color: #111;
      opacity: 0.8;
    }

    .menu a:hover { opacity: 1; }

    @media (max-width: 768px) {
      .menu { display: none; }
    }

    /* CONTENT */
    .page {
      padding: 140px 10vw 100px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    /* PRINTS GRID */
    .prints-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 3rem;
      justify-items: center;
    }

    .print-item {
      text-decoration: none;
      color: inherit;
      width: 100%;
      max-width: 320px;
    }

    .print-image {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .print-image .img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.5s ease;
      pointer-events: none; /* evita interacción directa */
    }

    .img-main { opacity: 1; }
    .img-hover { opacity: 0; }

    .print-item:hover .img-main { opacity: 0; }
    .print-item:hover .img-hover { opacity: 1; }

    .shield {
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 3;
    }

    .print-item h2 {
      font-size: 1rem;
      font-weight: 400;
      margin: 0.2rem 0;
    }

    .price {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Bloquea arrastre */
    img, .print-image {
      -webkit-user-drag: none;
      user-drag: none;
    }

    .catalog-header{

    text-align:center;

    margin-bottom:50px;

}

.catalog-header h1{

    font-size:2.3rem;

    font-weight:300;

    letter-spacing:.08em;

    margin-bottom:15px;

}

.catalog-header p{

    max-width:620px;

    margin:auto;

    line-height:1.8;

    color:#666;

}

.catalog-filter{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:22px;

    margin-bottom:60px;

}

.catalog-filter a{

    text-decoration:none;

    color:#777;

    cursor:pointer;

    transition:.25s;

}

.catalog-filter a:hover{

    color:#111;

}

.catalog-filter .active{

    color:#111;

    border-bottom:1px solid #111;

    padding-bottom:4px;

}

  </style>
</head>
